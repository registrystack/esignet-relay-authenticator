name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l provider)"
      - name: Core race tests and static checks
        run: |
          go test -race ./...
          go vet ./...
      - name: Pinned eSignet adapter checks
        run: ./integration/test.sh

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the pinned companion UI
        run: ./integration/build.sh --ui --load
      - name: Verify UI routing and privacy
        run: ./ui/smoke.sh esignet-oidc-ui:0.4.0-candidate
      - name: Audit locked UI production dependencies
        run: ./integration/audit-ui.sh
