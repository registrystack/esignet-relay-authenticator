worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  log_format identity_safe '$request_method $uri $status';
  access_log /dev/stdout identity_safe;
  # Error-level proxy failures include query strings and Referer; safe access logs retain status.
  error_log /dev/stderr crit;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 3000;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $esignet_backend esignet:8080;

    root /usr/share/nginx/html;
    index index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Routes from the pinned eSignet v2 and Thunder engine.
    # Client management, key administration and generic resource APIs stay private.
    location ~ ^/(?:oauth2/(?:authorize|auth/callback|token|jwks|userinfo|par)|\.well-known/(?:openid-configuration|oauth-authorization-server)|flow/(?:execute|meta)|csrf/token|design/resolve|i18n/languages|i18n/translations)(?:/|$) {
      proxy_pass http://$esignet_backend;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location ~ ^/(?:client-mgmt|system-info|v1/esignet|admin)(?:/|$) {
      return 404;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Content-Security-Policy "
          default-src 'self';
          style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://cdn.jsdelivr.net https://*.mosip.net;
          script-src 'self' https://www.google.com https://www.gstatic.com;
          frame-src https://www.google.com;
          connect-src 'self';
        " always;
      add_header Referrer-Policy "no-referrer" always;
    }
  }
}
