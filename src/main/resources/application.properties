# eSignet Relay Authenticator plugin — default property surface.
# Values here are placeholders/defaults; deployments override them in eSignet config.
# Secrets MUST come from the environment or a secret manager, never committed.
# See docs/esignet-relay-authenticator-plugin-spec.md and docs/GOAL.md.

# --- eSignet plugin loading ---
mosip.esignet.integration.scan-base-package=io.registry.esignet.relay
mosip.esignet.integration.authenticator=RelayAuthenticationService

# --- Relay endpoint (M1/M2) ---
# registry.relay.base-url must be a valid absolute http(s) URL.
# registry.relay.base-url=http://registry-relay:8080
# registry.relay.attribute-release.profile-id=esignet-civil-userinfo
# registry.relay.attribute-release.profile-version=v1
# path-template must contain {profile_id} and {version}.
registry.relay.attribute-release.path-template=/v1/attribute-releases/{profile_id}/versions/{version}/resolve
# registry.relay.attribute-release.purpose=https://demo.example.gov/purpose/esignet-identity-verification
registry.relay.attribute-release.accept=application/json
registry.relay.subject.id-type=national_id
# default-claims is the set of claims the active Relay profile/config declares. The plugin
# intersects requested claims with this set before calling Relay (Relay V1 denies the WHOLE
# request if any requested claim is outside the profile). Bound as a list (CSV).
# registry.relay.default-claims=individual_id,name,given_name,family_name,birthdate
registry.relay.connect-timeout-ms=2000
registry.relay.read-timeout-ms=5000

# --- Relay authorization (always sent as Authorization: Bearer on the wire) ---
# Required absolute path to a mounted secret file. The plugin rereads and validates the file for
# every Relay request so an atomic file replacement rotates the credential without a restart.
registry.relay.auth.bearer-token-file=${REGISTRY_RELAY_AUTH_BEARER_TOKEN_FILE}

# --- Authentication challenge (static OTP is for local/demo only; disabled by default) ---
registry.esignet.auth.supported-factors=OTP
registry.esignet.auth.otp.channels=email,phone
registry.esignet.auth.otp.mode=static
# registry.esignet.auth.otp.static-value=${REGISTRY_ESIGNET_STATIC_OTP:111111}
registry.esignet.auth.otp.static-enabled=false

# --- doKycAuth account-check (minimal claim list; proves the subject exists/releasable
#     WITHOUT fetching demographics before consent). Defaults to individual_id. ---
registry.esignet.account-check-claims=individual_id

# --- Internal KYC token and partner-specific subject derivation (secrets from env) ---
# registry.esignet.kyc-token.hmac-secret=${REGISTRY_ESIGNET_KYC_TOKEN_SECRET}
registry.esignet.kyc-token.ttl-seconds=300
# registry.esignet.psut.hmac-secret=${REGISTRY_ESIGNET_PSUT_SECRET}

# --- Claim mapping (M6): eSignet/OIDC UserInfo claim name -> Relay source token. ---
# $psut marks a protocol-derived claim (the partner-specific subject) that is supplied locally and
# NEVER requested from Relay. Dotted keys bind via claim-map[<dotted.name>]. Defaults to this map.
# registry.esignet.claim-map.sub=$psut
# registry.esignet.claim-map.individual_id=individual_id
# registry.esignet.claim-map.name=name
# registry.esignet.claim-map.given_name=given_name
# registry.esignet.claim-map.family_name=family_name
# registry.esignet.claim-map.birthdate=birthdate
# registry.esignet.claim-map.gender=gender
# registry.esignet.claim-map[address.region]=address.region

# --- KYC/UserInfo serialization and signing (keystore from deployment secrets) ---
# response-mode self-contained-jws: the plugin signs UserInfo/KYC as a compact RS256 JWS using the
# keystore below. The JWS header kid equals the certificate keyId from getAllKycSigningCertificates;
# the kid is the RFC 7638 SHA-256 JWK thumbprint of the RSA public key (stable per key). A JWE
# response type is NOT supported and fails closed (code relay_kyc_jwe_unsupported): the RP encryption
# key is not available to the plugin via the eSignet 1.8.0 integration API or KycExchangeDto.
registry.esignet.kyc.response-mode=self-contained-jws
# algorithm: JWS signing algorithm published in the header (default RS256).
registry.esignet.kyc.signing.algorithm=RS256
# keystore-type: JDK KeyStore type used to open keystore-path (default PKCS12; JKS also supported).
registry.esignet.kyc.signing.keystore-type=PKCS12
# registry.esignet.kyc.signing.keystore-path=${REGISTRY_ESIGNET_KYC_KEYSTORE_PATH}
# registry.esignet.kyc.signing.keystore-password=${REGISTRY_ESIGNET_KYC_KEYSTORE_PASSWORD}
# registry.esignet.kyc.signing.key-alias=${REGISTRY_ESIGNET_KYC_KEY_ALIAS}
# registry.esignet.kyc.signing.key-password=${REGISTRY_ESIGNET_KYC_KEY_PASSWORD}
